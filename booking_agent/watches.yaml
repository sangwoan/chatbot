defaults:
  max_auto_krw: 100000          # 이 금액 이상이면 승인 필요
  max_cancel_fee_ratio: 0.10    # 예약 시점 취소수수료가 예약금의 10% 초과면 승인 필요
  min_cancel_buffer_hours: 24   # 수수료 10% 이하로 취소 가능한 기간이 24시간 미만이면 승인 필요
  approval_timeout_min: 10      # 승인 요청 후 이 시간 안에 응답 없으면 진행 안 함
  realert_min: 15               # 같은 자리가 계속 열려 있으면 15분마다 다시 알림
  daily_cap_krw: 200000         # 하루 자동결제 총액 한도
  dry_run: true                 # true면 결제 직전에서 멈춤

notify:
  channels: [kakao, mac]        # kakao | telegram | mac | console

# 사이트 정책 등록부 (PLAN.md §9). 여기 판정이 allowed·load_only인 호스트만 감시한다.
#   terms: allowed     약관에 자동화 관련 금지 조항 없음
#          load_only   '서버 부하·운영 방해'를 일으키는 자동 접속만 금지 → 60초 이상 간격으로 허용
#          banned      약관이 자동화·스크레이핑·로봇 접근을 금지 → 감시 안 함
#          (미기재)     약관 확인 전 → 감시 안 함
#   status: blocked    기술적으로 막힌 사이트 → 감시 안 함
#   min_gap_s: 같은 호스트 요청 사이 최소 간격(기본 5초). robots.txt 판정은 실행 때마다 따로 한다.
sites:
  leisure-web.yanolja.com:
    terms: banned
    status: blocked
    checked: 2026-10-18
    note: "Cloudflare가 자동화 브라우저 차단, 약관상 자동화 금지(PLAN.md §7)"
  yeyak.seoul.go.kr:
    terms: allowed              # 서울시 통합회원 약관에 자동화 금지 조항 없음
    status: blocked
    checked: 2026-10-20
    note: "잔여 달력 API 3개에 매크로 방지(DynaPath, 2025-03-20) 적용 — 비정상 접근 차단. OpenAPI는 비정기 갱신·서비스 단위라 취소 감지 불가"
  reservation.knps.or.kr:
    terms: allowed              # 이용정책에 자동화 금지 조항 없음
    status: blocked
    checked: 2026-10-20
    note: "대피소·야영장 잔여 조회가 NetFUNNEL 대기열 뒤에 있고 예약은 캡차. 공식 대기신청(대기자→예약자 전환 시 결제 안내 문자) 사용"
  m.thankqcamping.com:
    terms: load_only            # 서비스 운영 방해·다량 전송만 금지, 자동화 금지 조항 없음(2025-08-21 약관)
    status: blocked
    checked: 2026-10-20
    note: "STCLab BotManager(매크로 탐지) 사이트 전체 적용, 잔여 조회에 대기열 통과값(wg_pass). 공식 빈자리 알림(푸시) 사용"

watches:
  # 예시 — 공개 JSON을 내려 주는 사이트 (sites에 판정을 먼저 기록해야 시작됨)
  # - id: example-json
  #   adapter: http_json
  #   url: https://example.com/product/123            # 알림에 넣을 예약 페이지
  #   dates: [2026-11-07]
  #   time_from: "10:00"
  #   time_to: "16:00"
  #   quantity: 2
  #   options:
  #     requests:
  #       - url: "https://example.com/api/rounds?date={date:%Y-%m-%d}"
  #     extract:
  #       items: "data.rounds[*]"
  #       time: "startTime"
  #       available: {path: "remainCount", gt: 0}
  #       remaining: "remainCount"
  #       price: "price"

  - id: hwadam-2026-fall
    enabled: false              # NOL 자동 접근 차단 확인(2026-10-18) — 감시하지 않음
    adapter: nol
    mode: notify_only           # NOL은 알림 + 직접 결제
    url: https://leisure-web.yanolja.com/leisure/10367229
    dates: [2026-10-24, 2026-10-25, 2026-11-01]   # 앞에 있을수록 우선
    time_from: "11:00"
    time_to: "15:00"
    quantity: 2
    max_total_krw: 100000
    poll_seconds: 60
    # 페이지의 취소 규정을 확인한 뒤 채움. 비워두면 '모름' 처리 → 자동 확정 금지
    # 원문(2026-10-18 확인): [화담숲입장권] 예약일 1일 전 23:59까지 취소 시 무료 취소,
    #   예약일 당일 혹은 예약일 이후 취소 시 30% 취소 수수료 적용
    # 전날 자정 마감을 보수적으로 '방문 24시간 전'으로 둔다(실제보다 일찍 마감되는 쪽).
    cancel_policy:
      tiers:
        - {hours_before: 24, fee_ratio: 0.0}
        - {hours_before: 0, fee_ratio: 0.3}
